    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pdk-green-dark: #0f2818;
            --pdk-green: #1d5a32;
            --pdk-green-light: #4caf50;
            --bg: #0a1410;
            --text: #e8efe9;
            --text-muted: #94a89a;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(76, 175, 80, 0.15);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(29, 90, 50, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 85% 80%, rgba(76, 175, 80, 0.12) 0%, transparent 50%);
        }

        .card {
            max-width: 480px;
            width: 100%;
            background: rgba(15, 25, 18, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(10, 20, 16, 0.7) 100%);
        }

        .profile-wrapper {
            position: relative;
            margin-top: -65px;
            padding: 0 32px;
            text-align: center;
        }

        .profile-image {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: block;
            margin: 0 auto;
            background: var(--bg);
        }

        .info {
            padding: 20px 32px 28px;
            text-align: center;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.4rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .tagline {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--pdk-green-light);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .institute {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 32px 32px;
        }

        .link-button {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .link-button::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: var(--pdk-green-light);
            transform: scaleY(0);
            transition: transform 0.3s ease;
            transform-origin: bottom;
        }

        .link-button:hover {
            background: rgba(76, 175, 80, 0.08);
            border-color: rgba(76, 175, 80, 0.4);
            transform: translateX(4px);
        }

        .link-button:hover::before {
            transform: scaleY(1);
            transform-origin: top;
        }

        .icon-wrapper {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .icon-wrapper svg {
            width: 24px;
            height: 24px;
        }

        /* Brand backgrounds */
        .icon-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .icon-linkedin {
            background: #0a66c2;
        }

        .icon-whatsapp {
            background: #25d366;
        }

        .icon-email {
            background: linear-gradient(135deg, #ea4335 0%, #d33b2c 100%);
        }

        .link-text {
            flex: 1;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .link-label {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text);
        }

        .link-info {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 300;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arrow {
            color: var(--text-muted);
            font-size: 1rem;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .link-button:hover .arrow {
            color: var(--pdk-green-light);
            transform: translateX(3px);
        }

        footer {
            text-align: center;
            padding: 16px;
            border-top: 1px solid var(--card-border);
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .banner { height: 150px; }
            .profile-image { width: 110px; height: 110px; }
            .profile-wrapper { margin-top: -55px; }
            .links, .info { padding-left: 20px; padding-right: 20px; }
        }
    </style>
</head>
